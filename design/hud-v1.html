<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Нить — HUD v1</title><style>
*{box-sizing:border-box;margin:0}body{background:#0b0d14;font-family:system-ui,sans-serif;color:#e6f7f5;display:flex;gap:40px;justify-content:center;align-items:center;min-height:100vh;padding:30px}
.ph{width:390px;height:780px;border-radius:44px;border:10px solid #1c1f2b;position:relative;overflow:hidden;box-shadow:0 20px 60px #000a}
.lbl{position:absolute;top:-28px;left:0;font-size:13px;color:#8a93a8}.wrap{position:relative}
.sky{position:absolute;inset:0;background:linear-gradient(#1a1240,#3b1f66 55%,#0f4a52)}
.moon{position:absolute;top:90px;right:50px;width:70px;height:70px;border-radius:50%;background:#d9fff8;box-shadow:0 0 40px #5ff2df}
.city{position:absolute;bottom:0;left:0;right:0;height:300px;display:flex;align-items:flex-end;gap:4px}
.city i{display:block;background:#0a0b17;flex:1}
.hero{position:absolute;left:50%;top:215px;transform:translateX(-50%);width:90px;height:190px}
.hero .h{width:44px;height:50px;margin:0 auto;background:#14b8a6;clip-path:polygon(50% 0,100% 30%,85% 100%,15% 100%,0 30%)}
.hero .b{width:90px;height:120px;background:linear-gradient(135deg,#7c3aed 50%,#14b8a6 50%);clip-path:polygon(0 0,100% 0,80% 100%,20% 100%)}
.hero .e{position:absolute;top:22px;left:30px;width:30px;height:6px;background:#e6fffb;box-shadow:0 0 10px #5ff2df}
.title{position:absolute;top:430px;width:100%;text-align:center;font-size:64px;font-weight:800;letter-spacing:12px;background:linear-gradient(#5ff2df,#a78bfa);-webkit-background-clip:text;color:transparent}
.menu{position:absolute;bottom:60px;left:40px;right:40px;display:flex;flex-direction:column;gap:12px}
.btn{padding:16px;border-radius:14px;background:#ffffff10;border:1px solid #5ff2df55;text-align:center;font-size:18px}.btn.p{background:linear-gradient(90deg,#0d9488,#7c3aed);border:0;font-weight:700}
.arc{position:absolute;border:2px solid #e6fffb99;border-color:#e6fffb99 transparent transparent;border-radius:50%}
.bar{height:10px;border-radius:5px;background:#ffffff22;margin-top:4px;overflow:hidden}.bar b{display:block;height:100%}
.tl{position:absolute;top:44px;left:18px;width:170px;font-size:11px}
.map{position:absolute;top:44px;right:18px;width:96px;height:96px;border-radius:50%;background:#0a0b17cc;border:2px solid #5ff2df;display:grid;place-items:center;font-size:11px}
.map:before{content:"С";position:absolute;top:2px;color:#a78bfa;font-weight:700}.map:after{content:"";width:0;height:0;border:7px solid transparent;border-bottom:14px solid #5ff2df;margin-top:-10px}
.cross{position:absolute;top:330px;left:50%;width:54px;height:54px;margin-left:-27px;border:2px dashed #5ff2df;border-radius:50%}.cross:after{content:"";position:absolute;inset:22px;background:#a78bfa;border-radius:50%}
.prompt{position:absolute;top:400px;width:100%;text-align:center}.prompt span{background:#0a0b17cc;padding:8px 14px;border-radius:20px;border:1px solid #a78bfa;font-size:14px}
.ic{position:absolute;width:44px;height:44px;border-radius:12px;background:#0a0b17cc;border:1px solid #5ff2df66;display:grid;place-items:center;font-size:18px}
.big{position:absolute;bottom:50px;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;text-align:center}
.roof{position:absolute;bottom:0;left:-20px;right:-20px;height:120px;background:#07080f;clip-path:polygon(0 30%,100% 0,100% 100%,0 100%)}
</style></head><body>
<div class="wrap"><div class="lbl">A · Главное меню</div><div class="ph"><div class="sky"></div><div class="moon"></div>
<div class="city"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i><i style="height:45%"></i><i style="height:75%"></i><i style="height:60%"></i></div>
<div class="arc" style="width:300px;height:200px;left:-40px;top:150px"></div>
<div class="hero"><div class="h"></div><div class="e"></div><div class="b"></div></div>
<div class="title">НИТЬ</div>
<div class="menu"><div class="btn p">Продолжить</div><div class="btn">Новая игра</div><div class="btn">Настройки</div></div></div></div>
<div class="wrap"><div class="lbl">B · Игровой HUD</div><div class="ph"><div class="sky"></div>
<div class="city" style="height:520px"><i style="height:50%"></i><i style="height:85%"></i><i style="height:65%"></i><i style="height:100%"></i><i style="height:55%"></i><i style="height:80%"></i></div>
<div class="arc" style="width:420px;height:300px;left:-10px;top:250px"></div><div class="arc" style="width:260px;height:180px;left:120px;top:200px"></div>
<div class="roof"></div>
<div class="tl">Здоровье<div class="bar"><b style="width:78%;background:#22c55e"></b></div><div style="margin-top:6px">Выносливость</div><div class="bar"><b style="width:55%;background:#f59e0b"></b></div><div style="margin-top:6px">Нить</div><div class="bar"><b style="width:66%;background:linear-gradient(90deg,#14b8a6,#a78bfa)"></b></div></div>
<div class="map">120 м</div>
<div class="ic" style="top:150px;right:18px">⏸</div><div class="ic" style="top:202px;right:18px">🗺</div>
<div class="cross"></div><div class="prompt"><span>Удерживай — рывок паутиной</span></div>
<div class="big" style="left:24px;background:#ffffff14;border:2px solid #5ff2df">Прыжок</div>
<div class="big" style="right:24px;background:linear-gradient(135deg,#0d9488,#7c3aed)">Нить<br>(держать)</div>
</div></div></body></html>
